version: '3.8'

services:
  test:
    build:
      context: ../.
      target: builder
    container_name: geosearch-poc-test
    command: go test ./tests/integration/... -v
    env_file:
      - ../.env.testing
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgis/postgis:15-3.3
    container_name: geosearch-postgres-test
    env_file:
      - ../.env.testing
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data: 